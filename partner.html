<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>대리점·제휴 제안 - (주)승빈푸드</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
    body{background:#fff;color:#0f172a;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
    img,video{display:block;width:100%;height:auto}
    .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .player{background:#000}
    .player video{max-height:100vh;object-fit:contain;background:#000}
    .slides{display:flex;flex-direction:column}
    .slides figure{margin:0}
    .slides img{background:#f8fafc}
    .slides figcaption{padding:8px 16px 14px;font-size:13px;font-weight:700;color:#64748b}
    .pdf-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid rgba(15,23,42,.08);box-shadow:0 -8px 24px rgba(15,23,42,.08)}
    .pdf-bar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border-radius:14px;background:#0f172a;color:#fff;text-align:center;text-decoration:none}
    .pdf-bar a:active{transform:scale(.98)}
    .pdf-bar b{font-size:16px;font-weight:800}
    .pdf-bar small{font-size:12px;font-weight:600;color:#cbd5e1}
  </style>
</head>
